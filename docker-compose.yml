version: '3.8'

services:
  redis:
    image: redis:alpine
    volumes:
      - redis_data:/data

  backend:
    build: 
      context: ./backend
    ports:
      - "3089:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - REDIS_URL=redis://redis:6379
      - TZ=America/Sao_Paulo
    volumes:
      - ./backend/prisma:/app/prisma
      - ./backend/uploads:/app/uploads
      - ./backups:/app/backups
    depends_on:
      - redis

  frontend:
    build: 
      context: ./frontend
    ports:
      - "8089:80"
    environment:
      - TZ=America/Sao_Paulo
    depends_on:
      - backend

volumes:
  redis_data:
